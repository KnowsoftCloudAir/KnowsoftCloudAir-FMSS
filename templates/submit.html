{% extends "base.html" %}
{% block title %}Submit Quotation{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-9">
        <div class="card">
            <div class="card-header py-3">
                <h5 class="mb-0"><i class="bi bi-file-earmark-text"></i> Vendor Quotation Submission</h5>
            </div>
            <div class="card-body p-4">
                <form method="POST" enctype="multipart/form-data">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Vendor Number *</label>
                            <input type="text" name="vendor_number" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Company Name *</label>
                            <input type="text" name="name" class="form-control" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Address</label>
                            <input type="text" name="address" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">CAC Number</label>
                            <input type="text" name="cac_number" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Bank</label>
                            <input type="text" name="bank" class="form-control">
                        </div>

                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Experience</label>
                            <select name="experience" class="form-select">
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Tax Clearance</label>
                            <select name="tax_clearance" class="form-select">
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">Reg with Govt</label>
                            <select name="reg_with_govt" class="form-select">
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <label class="form-label fw-semibold">3 Yrs Audit</label>
                            <select name="three_yrs_audit" class="form-select">
                                <option value="Yes">Yes</option>
                                <option value="No">No</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-semibold">Description of Goods / Services</label>
                            <textarea name="description" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Amount (₦) *</label>
                            <input type="number" step="0.01" name="amount" class="form-control" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold">Service Type</label>
                            <input type="text" name="service_type" class="form-control">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Comment</label>
                            <textarea name="comment" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-semibold">Upload Invoice / Quotation (PDF)</label>
                            <input type="file" name="invoice" class="form-control" accept=".pdf">
                        </div>
                    </div>
                    <div class="mt-4 d-flex gap-2">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="bi bi-check-circle"></i> Submit Quotation
                        </button>
                        <a href="/" class="btn btn-outline-secondary btn-lg">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
