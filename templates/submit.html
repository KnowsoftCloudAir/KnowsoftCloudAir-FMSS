{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card p-4">
            <h3 class="mb-4">Vendor Quotation Submission</h3>
            <form method="POST" enctype="multipart/form-data">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label">Vendor Number *</label>
                        <input type="text" name="vendor_number" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Company Name *</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Address</label>
                        <input type="text" name="address" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">CAC Number</label>
                        <input type="text" name="cac_number" class="form-control">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Bank</label>
                        <input type="text" name="bank" class="form-control">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label">Experience</label>
                        <select name="experience" class="form-select">
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Tax Clearance</label>
                        <select name="tax_clearance" class="form-select">
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Reg with Govt</label>
                        <select name="reg_with_govt" class="form-select">
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">3 Yrs Audit</label>
                        <select name="three_yrs_audit" class="form-select">
                            <option value="Yes">Yes</option>
                            <option value="No">No</option>
                        </select>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Description of Service / Goods</label>
                        <textarea name="description" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Amount (₦) *</label>
                        <input type="number" step="0.01" name="amount" class="form-control" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Service Type</label>
                        <input type="text" name="service_type" class="form-control">
                    </div>
                    <div class="col-12">
                        <label class="form-label">Comment</label>
                        <textarea name="comment" class="form-control" rows="2"></textarea>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Upload Invoice / Quotation (PDF)</label>
                        <input type="file" name="invoice" class="form-control" accept=".pdf">
                    </div>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-success btn-lg">Submit Quotation</button>
                    <a href="/" class="btn btn-outline-secondary btn-lg ms-2">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
