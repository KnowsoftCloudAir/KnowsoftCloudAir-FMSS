{% extends "base.html" %}
{% block title %}FACE Authorizing Officer Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="text-center mb-3"><i class="bi bi-pen"></i> Authorizing Officer</h3>
            <p class="text-muted small text-center">Log in to review FACE packages marked ready and authorize the cover letter.</p>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control form-control-lg" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg" required>
                </div>
                <div class="d-grid">
                    <button class="btn btn-success btn-lg">Login</button>
                </div>
            </form>
            <p class="text-center mt-3 mb-0">
                <a href="{{ url_for('face_hub') }}">Back to FACE</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
