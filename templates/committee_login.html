{% extends "base.html" %}
{% block title %}Committee Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card p-4">
            <h3 class="text-center mb-3"><i class="bi bi-people"></i> Committee Login</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Name</label>
                    <input type="text" name="name" class="form-control form-control-lg" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg" required>
                </div>
                <div class="d-grid">
                    <button type="submit" class="btn btn-success btn-lg">Login</button>
                </div>
            </form>
            <p class="text-muted small text-center mt-3 mb-0">Credentials are provided by the Administrator.</p>
        </div>
    </div>
</div>
{% endblock %}
