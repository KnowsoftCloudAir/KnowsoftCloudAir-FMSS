{% extends "base.html" %}
{% block title %}Settings{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="card">
            <div class="card-header">Organization Settings</div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Organization Name</label>
                        <input type="text" name="org_name" class="form-control" value="{{ org_name }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Upload Logo</label>
                        <input type="file" name="logo" class="form-control" accept="image/*">
                        {% if logo %}
                            <div class="mt-2">
                                <img src="{{ url_for('static', filename=logo) }}" style="max-height: 60px;">
                            </div>
                        {% endif %}
                    </div>
                    <button type="submit" class="btn btn-primary">Save Settings</button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">Back</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
